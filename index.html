<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Аналітика конструкторів</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<style>
:root {
  color-scheme: light;
  --bg: #f2f3f5;
  --surface: #ffffff;
  --surface-2: #f7f8fa;
  --surface-3: #eef0f3;
  --line: #e4e6eb;
  --line-2: #d5d8de;
  --ink: #111318;
  --ink-2: #4b515c;
  --ink-3: #858b96;
  --brand: #ffc21a;
  --brand-ink: #111318;
  --brand-soft: #fff4d1;
  --nav-bg: #111318;
  --hero-bg: #111318;
  --nav-ink: #a7adb8;
  --nav-ink-strong: #ffffff;
  --nav-hover: #1c1f26;
  --s1: #2a78d6;
  --s2: #eb6834;
  --s3: #1baf7a;
  --grid: #eceef1;
  --good: #0e8a4a; --good-bg: #e5f5ec;
  --bad: #cf3a2d;  --bad-bg: #fcebe9;
  --warn: #a86b00; --warn-bg: #fdf2d9;
  --bar: #9ec5f4;
  --bar-neg: #f2b1aa;
  --shadow: 0 1px 2px rgba(17,19,24,.04), 0 2px 8px rgba(17,19,24,.04);
  --shadow-pop: 0 12px 32px rgba(17,19,24,.16), 0 2px 6px rgba(17,19,24,.08);
  --r: 14px;
  --r-sm: 9px;
  --font: "Onest", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --display: "Unbounded", "Onest", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0d0e11; --surface: #16181d; --surface-2: #1b1e24; --surface-3: #22262d;
    --line: #2a2e36; --line-2: #363b44;
    --ink: #f4f5f7; --ink-2: #b6bcc6; --ink-3: #7d8490;
    --brand-soft: #3a2f0c; --nav-bg: #0a0b0d; --hero-bg: #232833; --nav-hover: #16181d;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --grid: #22262d;
    --good: #5bd08f; --good-bg: #13301f; --bad: #f28b80; --bad-bg: #3a1b18; --warn: #f1bd5b; --warn-bg: #372a10;
    --bar: #256abf; --bar-neg: #9c3e36;
    --shadow: 0 1px 2px rgba(0,0,0,.3); --shadow-pop: 0 12px 32px rgba(0,0,0,.5);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0d0e11; --surface: #16181d; --surface-2: #1b1e24; --surface-3: #22262d;
  --line: #2a2e36; --line-2: #363b44;
  --ink: #f4f5f7; --ink-2: #b6bcc6; --ink-3: #7d8490;
  --brand-soft: #3a2f0c; --nav-bg: #0a0b0d; --hero-bg: #232833; --nav-hover: #16181d;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --grid: #22262d;
  --good: #5bd08f; --good-bg: #13301f; --bad: #f28b80; --bad-bg: #3a1b18; --warn: #f1bd5b; --warn-bg: #372a10;
  --bar: #256abf; --bar-neg: #9c3e36;
  --shadow: 0 1px 2px rgba(0,0,0,.3); --shadow-pop: 0 12px 32px rgba(0,0,0,.5);
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
.tnum, td.n, th.n, .kpi-v, .val { font-variant-numeric: tabular-nums; }
[hidden] { display: none !important; }
:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ================= каркас ================= */
.app { display: grid; grid-template-columns: 236px minmax(0, 1fr); min-height: 100%; }
.side {
  background: var(--nav-bg); color: var(--nav-ink); display: flex; flex-direction: column;
  position: sticky; top: 0; height: 100vh; padding: 18px 12px 14px; gap: 4px;
}
.logo { display: flex; align-items: center; gap: 10px; padding: 2px 8px 18px; }
.logo-mark { width: 34px; height: 34px; flex: none; }
.logo-t { font-family: var(--display); font-weight: 600; font-size: 13.5px; color: var(--nav-ink-strong); letter-spacing: .01em; line-height: 1.15; }
.logo-s { font-size: 11.5px; color: var(--nav-ink); margin-top: 2px; }
.nav-g { font-size: 10.5px; letter-spacing: .12em; text-transform: uppercase; color: #6c727d; padding: 14px 10px 6px; }
.nav a {
  display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 9px; color: var(--nav-ink);
  text-decoration: none; font-size: 13.5px; position: relative; cursor: pointer;
}
.nav a svg { width: 17px; height: 17px; flex: none; opacity: .85; }
.nav a:hover { background: var(--nav-hover); color: var(--nav-ink-strong); }
.nav a.on { background: #1f232b; color: var(--nav-ink-strong); font-weight: 550; }
.nav a.on::before { content: ""; position: absolute; left: -12px; top: 8px; bottom: 8px; width: 4px; border-radius: 0 4px 4px 0; background: var(--brand); }
.side-foot { margin-top: auto; display: flex; flex-direction: column; gap: 8px; padding: 10px 6px 0; border-top: 1px solid #22262d; }
.sync-pill { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--nav-ink); padding: 4px 4px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: #3dbb74; flex: none; box-shadow: 0 0 0 3px rgba(61,187,116,.18); }
.dot.warn { background: #f1bd5b; box-shadow: 0 0 0 3px rgba(241,189,91,.18); }
.dot.bad { background: #f28b80; box-shadow: 0 0 0 3px rgba(242,139,128,.18); }
.dot.spin { animation: pulse 1s infinite alternate; }
@keyframes pulse { to { opacity: .35; } }
.side-btn { display: flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 9px; padding: 9px 12px; background: var(--brand); color: var(--brand-ink); font-weight: 600; cursor: pointer; font-size: 13px; }
.side-btn svg { width: 16px; height: 16px; flex: none; }
.side-btn:hover { filter: brightness(1.05); }
.side-btn:disabled { opacity: .6; cursor: default; }
.side-user { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: #6c727d; padding: 2px 4px; gap: 6px; }
.side-user button { background: none; border: 0; color: var(--nav-ink); cursor: pointer; padding: 2px 4px; font-size: 12px; }
.side-user span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.main { min-width: 0; padding: 22px 28px 60px; }
.topbar { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.page-t { font-family: var(--display); font-weight: 600; font-size: 22px; letter-spacing: -.01em; margin: 0; text-wrap: balance; }
.page-s { color: var(--ink-3); font-size: 13px; margin-top: 4px; }
.tools { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.demo-bar { background: var(--brand-soft); color: var(--ink); border: 1px solid color-mix(in srgb, var(--brand) 55%, transparent); border-radius: 12px; padding: 9px 14px; font-size: 13px; margin-bottom: 16px; display: flex; gap: 10px; align-items: center; }
.demo-bar b { font-weight: 650; }

/* ================= кнопки й поля ================= */
.btn { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line-2); background: var(--surface); border-radius: var(--r-sm); padding: 7px 12px; cursor: pointer; font-size: 13px; min-height: 36px; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn svg { width: 16px; height: 16px; }
.btn.primary { background: var(--ink); color: var(--surface); border-color: var(--ink); font-weight: 600; }
.btn.primary:hover { opacity: .9; }
.btn.yellow { background: var(--brand); border-color: var(--brand); color: var(--brand-ink); font-weight: 600; }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.danger { color: var(--bad); }
.btn.sm { min-height: 30px; padding: 4px 10px; font-size: 12.5px; }
.icon-btn { border: 0; background: none; color: var(--ink-3); cursor: pointer; width: 30px; height: 30px; border-radius: 8px; display: inline-grid; place-items: center; }
.icon-btn:hover { background: var(--surface-3); color: var(--ink); }
.icon-btn svg { width: 16px; height: 16px; }
input[type=text], input[type=number], input[type=date], input[type=month], input[type=email], input[type=password], select, textarea {
  background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--r-sm); padding: 7px 10px; min-height: 36px; width: 100%;
}
input:focus, select:focus, textarea:focus { outline: 2px solid color-mix(in srgb, var(--s1) 45%, transparent); border-color: var(--s1); }
label.f { display: flex; flex-direction: column; gap: 5px; font-size: 12px; color: var(--ink-2); font-weight: 500; min-width: 0; }
.form { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); align-items: end; }
.form .wide { grid-column: span 2; }
.seg { display: inline-flex; background: var(--surface-3); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: none; padding: 5px 11px; border-radius: 8px; cursor: pointer; color: var(--ink-2); font-size: 12.5px; white-space: nowrap; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); font-weight: 550; }

/* період */
.period { position: relative; }
.period-btn { min-width: 220px; justify-content: space-between; }
.period-btn .lbl { font-weight: 600; }
.period-btn .rng { color: var(--ink-3); font-size: 12px; }
.pop { position: absolute; right: 0; top: calc(100% + 6px); z-index: 30; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-pop); width: 280px; padding: 6px; }
.pop button.row { display: flex; width: 100%; justify-content: space-between; align-items: center; border: 0; background: none; padding: 8px 10px; border-radius: 8px; cursor: pointer; font-size: 13px; text-align: left; }
.pop button.row:hover { background: var(--surface-2); }
.pop button.row.on { font-weight: 650; }
.pop button.row .ck { width: 16px; height: 16px; opacity: 0; }
.pop button.row.on .ck { opacity: 1; }
.pop .custom { border-top: 1px solid var(--line); margin-top: 6px; padding: 10px 6px 4px; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.pop .custom .btn { grid-column: span 2; justify-content: center; }

/* ================= картки ================= */
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 14px; }
.c12 { grid-column: span 12; } .c8 { grid-column: span 8; } .c7 { grid-column: span 7; } .c6 { grid-column: span 6; } .c5 { grid-column: span 5; } .c4 { grid-column: span 4; } .c3 { grid-column: span 3; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 18px; box-shadow: var(--shadow); min-width: 0; }
.card-h { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
.card-t { font-weight: 650; font-size: 14.5px; margin: 0; }
.card-s { color: var(--ink-3); font-size: 12.5px; margin-top: 2px; }
.muted { color: var(--ink-3); }
.small { font-size: 12.5px; }
.neg { color: var(--bad); }
.pos { color: var(--good); }
.loading-veil { transition: opacity .2s; }
.is-loading .loading-veil { opacity: .5; pointer-events: none; }

/* KPI */
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 13px 15px 12px; box-shadow: var(--shadow); min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.kpi-l { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-start; gap: 4px 6px; color: var(--ink-2); font-size: 12.5px; }
.kpi-v { font-size: 21px; font-weight: 700; letter-spacing: -.02em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi-s { color: var(--ink-3); font-size: 12px; }
.kpi.hero { grid-column: span 2; background: var(--hero-bg); color: #fff; border-color: var(--hero-bg); position: relative; overflow: hidden; }
.kpi.hero .kpi-l, .kpi.hero .kpi-s { color: rgba(255,255,255,.7); }
.kpi.hero .kpi-v { font-family: var(--display); font-weight: 600; font-size: 28px; letter-spacing: -.02em; }
.kpi.hero .kpi-v.neg { color: #ff9b90; }
.kpi.hero .spark { display: block; width: 100%; height: 38px; margin-top: 8px; }
.kpi.hero .studs { position: absolute; right: 14px; top: 14px; display: grid; grid-template-columns: repeat(2, 9px); gap: 5px; }
.kpi.hero .studs i { width: 9px; height: 9px; border-radius: 50%; background: var(--brand); display: block; }
.delta { font-size: 11.5px; font-weight: 650; padding: 1px 7px; border-radius: 999px; white-space: nowrap; flex: none; line-height: 18px; }
.delta.up { color: var(--good); background: var(--good-bg); }
.delta.down { color: var(--bad); background: var(--bad-bg); }
.delta.flat { color: var(--ink-3); background: var(--surface-3); }
.kpi.hero .delta { background: rgba(255,255,255,.12); color: #fff; }
.kpi .target { font-size: 11.5px; }
.flag { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 600; padding: 0 7px; border-radius: 999px; line-height: 18px; }
.flag.good { color: var(--good); background: var(--good-bg); }
.flag.bad { color: var(--bad); background: var(--bad-bg); }
.flag.warn { color: var(--warn); background: var(--warn-bg); }

/* графіки */
.chart { position: relative; height: 290px; }
.chart.sm { height: 220px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 12.5px; color: var(--ink-2); }
.legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
.legend i.box { width: 10px; height: 10px; border-radius: 3px; }

/* P&L */
.pl { width: 100%; border-collapse: collapse; }
.pl td { padding: 7px 0; border-bottom: 1px solid var(--grid); vertical-align: middle; font-size: 13px; }
.pl tr:last-child td { border-bottom: 0; }
.pl td.n { text-align: right; white-space: nowrap; padding-left: 10px; }
.pl td.p { text-align: right; color: var(--ink-3); width: 44px; font-size: 12px; }
.pl .bc { width: 30%; padding-left: 12px; }
.pl .b { height: 8px; border-radius: 4px; background: var(--bar); min-width: 2px; }
.pl .b.neg { background: var(--bar-neg); }
.pl tr.tot td { font-weight: 700; }
.pl tr.tot.final td { border-top: 2px solid var(--ink); font-size: 14px; }
.pl tr.sub td:first-child { padding-left: 14px; color: var(--ink-2); }

/* таблиці */
.tw { overflow-x: auto; margin: 0 -6px; }
table.t { width: 100%; border-collapse: collapse; font-size: 13px; }
table.t th { text-align: left; font-weight: 600; color: var(--ink-3); font-size: 11.5px; letter-spacing: .02em; padding: 8px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface); position: sticky; top: 0; }
table.t th.sort { cursor: pointer; user-select: none; }
table.t th.sort:hover { color: var(--ink); }
table.t th.sorted { color: var(--ink); }
table.t td { padding: 8px 8px; border-bottom: 1px solid var(--grid); }
table.t td.n, table.t th.n { text-align: right; white-space: nowrap; }
table.t tbody tr:hover td { background: var(--surface-2); }
table.t tfoot td { font-weight: 700; border-top: 1px solid var(--line-2); border-bottom: 0; background: var(--surface-2); }
table.t .name { max-width: 340px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tbl-scroll { max-height: 560px; overflow: auto; }
.pill { display: inline-block; padding: 1px 9px; border-radius: 999px; font-size: 12px; font-weight: 550; white-space: nowrap; }
.pill.success { background: var(--good-bg); color: var(--good); }
.pill.fail, .pill.return { background: var(--bad-bg); color: var(--bad); }
.pill.work { background: var(--surface-3); color: var(--ink-2); }
.pill.ignore { background: var(--surface-3); color: var(--ink-3); text-decoration: line-through; }
.minibar { height: 6px; border-radius: 3px; background: var(--surface-3); overflow: hidden; min-width: 60px; }
.minibar i { display: block; height: 100%; background: var(--s1); border-radius: 3px; }

.hb { display: grid; grid-template-columns: minmax(100px, 40%) 1fr auto; gap: 10px; align-items: center; padding: 6px 0; font-size: 13px; }
.hb .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--ink-2); }
.hb .tr { height: 10px; border-radius: 5px; background: var(--surface-3); overflow: hidden; display: flex; gap: 2px; }
.hb .fl { height: 100%; background: var(--s1); border-radius: 5px; }
.hb .fl.s2 { background: var(--s2); }
.hb .val { text-align: right; white-space: nowrap; }

/* воронка */
.funnel { display: flex; flex-direction: column; gap: 8px; }
.fstep { display: grid; grid-template-columns: 120px 1fr 90px; gap: 10px; align-items: center; font-size: 13px; }
.fstep .fb { height: 26px; border-radius: 7px; background: var(--s1); display: flex; align-items: center; padding: 0 8px; color: #fff; font-weight: 600; font-size: 12px; min-width: 34px; }
.fstep .fb.s2 { background: var(--s3); }
.fstep .fb.s4 { background: var(--brand); color: var(--brand-ink); }
.cell-edit { border: 1px dashed var(--line-2); background: var(--surface-2); border-radius: 7px; padding: 3px 8px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.cell-edit:hover { border-color: var(--s1); background: var(--surface); }
.cell-edit svg { width: 13px; height: 13px; color: var(--ink-3); }
.ad-pop { text-align: left; font-weight: 400; }
.warn-t { color: var(--warn); font-weight: 600; }
.fstep .fb.s3 { background: var(--bar-neg); color: var(--ink); }

.stat-list { display: flex; flex-direction: column; }
.stat-row { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--grid); font-size: 13px; }
.stat-row:last-child { border-bottom: 0; }
.stat-row b { font-weight: 650; }

/* менеджери */
.mgr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.mgr-card .ava { width: 38px; height: 38px; border-radius: 11px; background: var(--brand); color: var(--brand-ink); display: grid; place-items: center; font-family: var(--display); font-weight: 600; }
.mgr-pay { font-family: var(--display); font-size: 22px; font-weight: 600; margin: 10px 0 6px; }

.hint { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; color: var(--ink-2); font-size: 13px; }
.hint.warn { background: var(--warn-bg); border-color: transparent; color: var(--warn); }
.empty { text-align: center; color: var(--ink-3); padding: 28px 10px; font-size: 13px; }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translate(-50%, 20px); background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 10px; font-size: 13px; opacity: 0; pointer-events: none; transition: all .2s; z-index: 100; max-width: calc(100vw - 32px); }
.toast.on { opacity: 1; transform: translate(-50%, 0); }
.toast.err { background: var(--bad); color: #fff; }
.tip { position: fixed; z-index: 90; pointer-events: none; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-pop); border-radius: 8px; padding: 6px 10px; font-size: 12.5px; display: none; max-width: 280px; }
.modal-bg { position: fixed; inset: 0; background: rgba(10,11,13,.45); display: grid; place-items: center; z-index: 80; padding: 16px; }
.modal { background: var(--surface); border-radius: 16px; box-shadow: var(--shadow-pop); padding: 20px; width: 100%; max-width: 380px; }
.modal h3 { margin: 0 0 6px; font-size: 16px; }
.modal p { margin: 0 0 16px; color: var(--ink-2); font-size: 13.5px; }
.modal .acts { display: flex; justify-content: flex-end; gap: 8px; }
.progress { height: 6px; background: var(--surface-3); border-radius: 3px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--brand); width: 0; transition: width .3s; }

/* вхід */
.login { min-height: 100%; display: grid; place-items: center; padding: 24px 16px; background: var(--nav-bg); }
.login form { width: 100%; max-width: 360px; background: var(--surface); border-radius: 18px; padding: 26px; display: flex; flex-direction: column; gap: 12px; box-shadow: var(--shadow-pop); }
.login h1 { font-family: var(--display); font-size: 19px; margin: 6px 0 0; font-weight: 600; }
.login .err { color: var(--bad); font-size: 13px; min-height: 18px; }

/* ================= адаптив ================= */
@media (max-width: 1280px) { .kpis { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 1100px) {
  .c8, .c7, .c6, .c5, .c4 { grid-column: span 12; }

<body>
<div id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="tip" id="tip"></div>
<script>
// ===================== ДЕМО-ДАНІ =====================
// Працює, коли в CONFIG не вказано Supabase. Імітує ту саму базу й SQL-функції.
function createDemoApi() {
  let seed = 7;
  const rnd = () => ((seed = (seed * 1664525 + 1013904223) % 4294967296) / 4294967296);
  const pick = (a) => a[Math.floor(rnd() * a.length)];
  const w = (pairs) => { let x = rnd() * pairs.reduce((s, p) => s + p[1], 0); for (const [v, k] of pairs) if ((x -= k) < 0) return v; return pairs[0][0]; };
  const pad = (n) => String(n).padStart(2, '0');
  const ymdL = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;

  const PRODUCTS = [
    ['Конструктор «Пожежна станція» 820 дет.', 1890], ['Конструктор «Космічний шатл» 1100 дет.', 2650], ['Конструктор «Замок лицаря» 950 дет.', 2190],
    ['Конструктор «Гоночне авто» 420 дет.', 890], ['Конструктор «Динозавр T-Rex» 380 дет.', 790], ['Конструктор «Поліцейська дільниця» 700 дет.', 1590],
    ['Конструктор «Ферма» 310 дет.', 690], ['Конструктор «Робот-трансформер» 560 дет.', 1190], ['Магнітний конструктор 64 дет.', 1290],
    ['Магнітний конструктор 120 дет.', 2190], ["Дерев'яний конструктор «Місто» 150 дет.", 990], ['Конструктор для малюків 48 дет.', 490],
    ['Технічний конструктор «Екскаватор» 1300 дет.', 3490], ['Технічний конструктор «Кран» 1800 дет.', 4290], ['Конструктор «Піратський корабель» 1250 дет.', 2890],
    ["Конструктор «Кав'ярня» 520 дет.", 1090], ['Набір мініфігурок 12 шт.', 390], ['Електронний конструктор «Юний інженер»', 1690],
    ['Конструктор «Вантажівка-сміттєвоз» 610 дет.', 1390], ['Конструктор «Аеропорт» 1450 дет.', 3190],
  ];
  const REASONS = ['Не відповідає на дзвінки', 'Передумав', 'Дорога доставка', 'Знайшов дешевше', 'Не забрав з пошти', 'Товар не сподобався'];
  const statuses = [
    { id: 1, name: 'Новий', type: 1, category: 'work', confirmed: false, manual: false, sort: 0 },
    { id: 2, name: 'Підтверджено', type: 1, category: 'work', confirmed: true, manual: false, sort: 1 },
    { id: 3, name: 'Відправлено', type: 1, category: 'work', confirmed: true, manual: false, sort: 2 },
    { id: 4, name: 'Продаж', type: 2, category: 'success', confirmed: true, manual: false, sort: 3 },
    { id: 5, name: 'Відмова', type: 3, category: 'fail', confirmed: false, manual: false, sort: 4 },
    { id: 6, name: 'Повернення', type: 3, category: 'return', confirmed: false, manual: false, sort: 5 },
    { id: 7, name: 'Дубль / видалено', type: 4, category: 'ignore', confirmed: false, manual: false, sort: 6 },
  ];
  const managers = [
    { id: 3, name: 'Олена', rate_per_order: 18, upsell_pct: 0.2, active: true },
    { id: 4, name: 'Максим', rate_per_order: 18, upsell_pct: 0.2, active: true },
    { id: 5, name: 'Ірина', rate_per_order: 16, upsell_pct: 0.25, active: true },
  ];
  const stores = [
    { id: 21, name: 'BrickLand', active: true, sort: 0 },
    { id: 22, name: 'Кубик', active: true, sort: 1 },
  ];
  const orders = [], items = [];
  const today = new Date(); today.setHours(12, 0, 0, 0);
  const start = new Date(today); start.setDate(start.getDate() - 420);
  let id = 50000;
  for (let d = new Date(start); d <= today; d.setDate(d.getDate() + 1)) {
    const age = Math.round((today - d) / 86400e3);
    const m = d.getMonth();
    const season = 1 + 0.3 * Math.cos((m - 11) / 12 * 2 * Math.PI) + (m === 11 ? 0.45 : 0) + (m === 8 ? 0.15 : 0);
    const growth = 0.75 + 0.35 * (1 - age / 420);
    const n = Math.round((10 + rnd() * 9) * season * growth * ([0, 6].includes(d.getDay()) ? 1.2 : 1));
    for (let k = 0; k < n; k++) {
      id++;
      const sajt = rnd() < 0.62 ? 21 : 22;
      const src = sajt === 21 ? w([['facebook', 26], ['instagram', 18], ['google', 30], ['sms', 6], [null, 20]]) : w([['facebook', 22], ['instagram', 20], ['tiktok', 40], [null, 18]]);
      const cnt = w([[1, 68], [2, 23], [3, 9]]);
      const its = [];
      for (let j = 0; j < cnt; j++) {
        const pi = Math.floor(rnd() * PRODUCTS.length);
        const [name, price] = PRODUCTS[pi];
        its.push({ pi, name, price, qty: rnd() < 0.08 ? 2 : 1, cost: Math.round(price * (0.54 + rnd() * 0.12)), pre: j > 0 && rnd() < 0.5 });
      }
      const amount = its.reduce((s, i) => s + i.price * i.qty, 0);
      const cost = its.reduce((s, i) => s + i.cost * i.qty, 0);
      const cod = rnd() < 0.6;
      let st;
      if (age > 14) st = w([[4, 70], [5, 15], [6, 10], [7, 5]]);
      else if (age > 5) st = w([[4, 42], [3, 32], [5, 12], [6, 4], [7, 4], [2, 6]]);
      else st = w([[1, 22], [2, 30], [3, 30], [4, 6], [5, 8], [7, 4]]);
      const ship = amount >= 1500 ? 70 + Math.round(rnd() * 45) : 0;
      const comm = cod ? Math.round(amount * 0.02 + 20) : Math.round(amount * 0.013);
      const pd = new Date(d); pd.setDate(pd.getDate() + 2 + Math.floor(rnd() * 4));
      const sale = st === 4;
      const payed = sale ? (rnd() < 0.97 ? amount : 0) : (!cod && st === 3 ? amount : 0);
      const upsell = its.filter((i) => i.pre).reduce((s, i) => s + i.price * i.qty, 0);
      orders.push({
        id, order_date: ymdL(d), order_time: `${ymdL(d)} ${pad(8 + Math.floor(rnd() * 14))}:${pad(Math.floor(rnd() * 60))}:00`,
        payment_date: sale ? (pd > today ? ymdL(today) : ymdL(pd)) : null, status_id: st,
        payment_amount: amount, cost_price: cost, shipping_costs: st === 6 ? ship + 110 : (sale ? ship : 0), commission: sale ? comm : 0, expenses_amount: 0,
        payed_amount: payed, rest_pay: (sale || st === 3) ? amount - payed : 0, upsell_amount: upsell,
        rejection_reason: st === 5 || st === 6 ? pick(REASONS) : null, utm_source: src,
        sajt, manager_id: sajt === 21 ? w([[3, 60], [4, 40]]) : w([[4, 30], [5, 70]]), payment_method: cod ? 'Накладений платіж' : pick(['Оплата на картку', 'LiqPay', 'Monobank']),
      });
      its.forEach((i, pos) => items.push({ order_id: id, pos, product_id: i.pi + 1, name: i.name, sku: 'KB-' + (100 + i.pi), amount: i.qty, price: i.price, cost_price: i.cost }));
    }
  }
  const byId = new Map(orders.map((o) => [o.id, o]));
  const cat = (o) => statuses.find((s) => s.id === o.status_id)?.category || 'work';
  const conf = (o) => !!statuses.find((s) => s.id === o.status_id)?.confirmed;

  // Витрати: реклама щотижня (Meta в $), SMS щомісяця, блогери
  const expenses = []; let eid = 1;
  const settings = {
    finance_date: 'order', usd_rate: 41.5, eur_rate: 45, store_name: 'Магазин конструкторів',
    expense_categories: ['Реклама', 'Податки', 'SMS-розсилки', 'Зарплата', 'Оренда / склад', 'Пакування', 'Сервіси (CRM, сайт)', 'Банк / еквайринг', 'Інше'],
    ad_channels: ['Meta', 'Google', 'TikTok', 'Блогери', 'Розсилки', 'Інше'],
    targets: { romi: 1.0, cpo: 300, conversion: 0.6 }, managers_in_pnl: true,
    backfill_done: true, last_sync: new Date(Date.now() - 6 * 60e3).toISOString(), last_run: new Date(Date.now() - 6 * 60e3).toISOString(),
  };
  const addExp = (date, date_to, category, channel, amount, currency, comment, store_id = null) => {
    const rate = currency === 'USD' ? 41.5 : 1;
    expenses.push({ id: eid++, date, date_to, category, channel, amount, currency, rate, amount_uah: Math.round(amount * rate * 100) / 100, comment, store_id, created_at: date });
  };
  for (let d = new Date(start); d <= today; d.setDate(d.getDate() + 7)) {
    const e = new Date(d); e.setDate(e.getDate() + 6);
    const to = e > today ? ymdL(today) : ymdL(e);
    addExp(ymdL(d), to, 'Реклама', 'Meta', Math.round(140 + rnd() * 60), 'USD', 'Facebook + Instagram', 21);
    addExp(ymdL(d), to, 'Реклама', 'Google', Math.round(6000 + rnd() * 3000), 'UAH', 'Google Ads', 21);
    addExp(ymdL(d), to, 'Реклама', 'Meta', Math.round(80 + rnd() * 40), 'USD', 'Facebook + Instagram', 22);
    addExp(ymdL(d), to, 'Реклама', 'TikTok', Math.round(90 + rnd() * 60), 'USD', 'TikTok Ads', 22);
  }
  for (let mm = new Date(start.getFullYear(), start.getMonth(), 1); mm <= today; mm.setMonth(mm.getMonth() + 1)) {
    const last = new Date(mm.getFullYear(), mm.getMonth() + 1, 0);
    addExp(ymdL(mm), ymdL(last), 'SMS-розсилки', null, Math.round(1600 + rnd() * 900), 'UAH', 'Розсилка по базі');
    addExp(ymdL(new Date(mm.getFullYear(), mm.getMonth(), 12)), null, 'Реклама', 'Блогери', Math.round(4000 + rnd() * 5000), 'UAH', 'Інтеграція у блогера', 21);
    addExp(ymdL(mm), ymdL(last), 'Оренда / склад', null, 6000, 'UAH', 'Склад', null);
  }
  const rules = [
    { id: 1, name: 'Єдиний податок 5%', kind: 'percent_revenue', value: 5, category: 'Податки', date_from: null, date_to: null, store_id: null, active: true },
    { id: 2, name: 'ЄСВ за ФОП', kind: 'fixed_monthly', value: 1902.34, category: 'Податки', date_from: null, date_to: null, store_id: null, active: true },
    { id: 3, name: 'SalesDrive + сайт', kind: 'fixed_monthly', value: 2400, category: 'Сервіси (CRM, сайт)', date_from: null, date_to: null, store_id: null, active: true },
    { id: 4, name: 'Пакування (коробка, скотч)', kind: 'per_order', value: 14, category: 'Пакування', date_from: null, date_to: null, store_id: null, active: true },
  ];
  let rid = 5;
  const syncLog = [
    { id: 3, at: new Date(Date.now() - 6 * 60e3).toISOString(), mode: 'cron', orders: 12, pages: 1, ok: true, message: 'Оновлено замовлень: 12' },
    { id: 2, at: new Date(Date.now() - 21 * 60e3).toISOString(), mode: 'cron', orders: 9, pages: 1, ok: true, message: 'Оновлено замовлень: 9' },
    { id: 1, at: new Date(Date.now() - 36 * 60e3).toISOString(), mode: 'cron', orders: 15, pages: 1, ok: true, message: 'Оновлено замовлень: 15' },
  ];

  const inScope = (o, st) => (st != null ? o.sajt === st : (o.sajt == null || stores.find((x) => x.id === o.sajt)?.active !== false));
  const scoped = (st) => orders.filter((o) => inScope(o, st));
  const fin = (o, f) => (f === 'payment' ? (o.payment_date || o.order_date) : o.order_date);
  const inR = (d, a, b) => d >= a && d <= b;
  const group = (list, keyFn, init, add) => { const m = new Map(); for (const x of list) { const k = keyFn(x); if (!m.has(k)) m.set(k, init(k)); add(m.get(k), x); } return [...m.values()]; };
  const R = {
    stats_daily({ p_from, p_to, p_fin, p_store }) {
      const orders = scoped(p_store);
      const days = new Map();
      const g = (d) => { if (!days.has(d)) days.set(d, { day: d, leads: 0, confirmed: 0, unconfirmed: 0, success: 0, fail: 0, returns: 0, work: 0, sales: 0, revenue: 0, cogs: 0, order_costs: 0, return_costs: 0, payed: 0, upsell: 0 }); return days.get(d); };
      for (const o of orders) {
        const c = cat(o); if (c === 'ignore') continue;
        if (inR(o.order_date, p_from, p_to)) { const x = g(o.order_date); x.leads++; x[c === 'return' ? 'returns' : c]++; if (conf(o)) x.confirmed++; else if (c === 'work') x.unconfirmed++; }
        const fd = fin(o, p_fin);
        if (inR(fd, p_from, p_to)) {
          if (c === 'success') { const x = g(fd); x.sales++; x.revenue += o.payment_amount; x.cogs += o.cost_price; x.order_costs += o.shipping_costs + o.commission + o.expenses_amount; x.payed += o.payed_amount; x.upsell += o.upsell_amount; }
          if (c === 'return') g(fd).return_costs += o.shipping_costs + o.commission + o.expenses_amount;
        }
      }
      return [...days.values()].sort((a, b) => a.day.localeCompare(b.day));
    },
    stats_channels({ p_from, p_to, p_fin, p_store }) {
      const orders = scoped(p_store);
      const m = new Map(); const g = (u) => { u = u || ''; if (!m.has(u)) m.set(u, { utm_source: u, leads: 0, sales: 0, revenue: 0, gross: 0 }); return m.get(u); };
      for (const o of orders) {
        const c = cat(o); if (c === 'ignore') continue;
        if (inR(o.order_date, p_from, p_to)) g(o.utm_source).leads++;
        if (c === 'success' && inR(fin(o, p_fin), p_from, p_to)) { const x = g(o.utm_source); x.sales++; x.revenue += o.payment_amount; x.gross += o.payment_amount - o.cost_price - o.shipping_costs - o.commission - o.expenses_amount; }
      }
      return [...m.values()];
    },
    stats_products({ p_from, p_to, p_fin, p_store }) {
      const m = new Map();
      for (const i of items) {
        const o = byId.get(i.order_id); if (!inScope(o, p_store)) continue; const c = cat(o);
        if (!['success', 'fail', 'return'].includes(c)) continue;
        if (!inR(c === 'success' ? fin(o, p_fin) : o.order_date, p_from, p_to)) continue;
        if (!m.has(i.product_id)) m.set(i.product_id, { product_id: i.product_id, name: i.name, sku: i.sku, sold: 0, refused: 0, returned: 0, revenue: 0, cost: 0, profit: 0 });
        const x = m.get(i.product_id);
        if (c === 'success') { x.sold += i.amount; x.revenue += i.price * i.amount; x.cost += i.cost_price * i.amount; x.profit += (i.price - i.cost_price) * i.amount; }
        else if (c === 'fail') x.refused += i.amount; else x.returned += i.amount;
      }
      return [...m.values()].sort((a, b) => b.profit - a.profit);
    },
    stats_statuses({ p_from, p_to, p_store }) {
      const list = scoped(p_store).filter((o) => inR(o.order_date, p_from, p_to) && cat(o) !== 'ignore');
      return group(list, (o) => o.status_id, (k) => { const s = statuses.find((x) => x.id === k); return { status_id: k, name: s?.name || 'Статус #' + k, category: s?.category || 'work', cnt: 0, amount: 0, sort: s?.sort || 0 }; }, (x, o) => { x.cnt++; x.amount += o.payment_amount; })
        .sort((a, b) => a.sort - b.sort);
    },
    stats_reasons({ p_from, p_to, p_store }) {
      const list = scoped(p_store).filter((o) => inR(o.order_date, p_from, p_to) && ['fail', 'return'].includes(cat(o)));
      return group(list, (o) => o.rejection_reason || '—', (k) => ({ reason: k, fail: 0, returns: 0 }), (x, o) => { if (cat(o) === 'fail') x.fail++; else x.returns++; })
        .sort((a, b) => (b.fail + b.returns) - (a.fail + a.returns));
    },
    stats_payments({ p_from, p_to, p_fin, p_store }) {
      const orders = scoped(p_store);
      const s = orders.filter((o) => cat(o) === 'success' && inR(fin(o, p_fin), p_from, p_to));
      const back = new Date(p_to + 'T00:00:00Z'); back.setUTCDate(back.getUTCDate() - 90); const b = back.toISOString().slice(0, 10);
      const pend = orders.filter((o) => ['work', 'success'].includes(cat(o)) && o.rest_pay > 0.009 && o.order_date >= b);
      return {
        payed: s.reduce((a, o) => a + o.payed_amount, 0), rest: s.reduce((a, o) => a + o.rest_pay, 0), unpaid_count: s.filter((o) => o.rest_pay > 0.009).length,
        pending_sum: pend.reduce((a, o) => a + o.rest_pay, 0), pending_count: pend.length,
        by_method: group(s, (o) => o.payment_method || '—', (k) => ({ method: k, cnt: 0, amount: 0 }), (x, o) => { x.cnt++; x.amount += o.payment_amount; }).sort((a, b) => b.amount - a.amount),
      };
    },
    stats_managers({ p_from, p_to, p_fin, p_store }) {
      const orders = scoped(p_store);
      const m = new Map(); const g = (id) => { if (!m.has(id)) m.set(id, { manager_id: id, leads: 0, confirmed: 0, success: 0, fail: 0, returns: 0, sales: 0, revenue: 0, gross: 0, upsell: 0 }); return m.get(id); };
      for (const o of orders) {
        const c = cat(o); if (c === 'ignore') continue;
        if (inR(o.order_date, p_from, p_to)) { const x = g(o.manager_id); x.leads++; if (conf(o)) x.confirmed++; if (c === 'success') x.success++; if (c === 'fail') x.fail++; if (c === 'return') x.returns++; }
        if (c === 'success' && inR(fin(o, p_fin), p_from, p_to)) { const x = g(o.manager_id); x.sales++; x.revenue += o.payment_amount; x.gross += o.payment_amount - o.cost_price - o.shipping_costs - o.commission - o.expenses_amount; x.upsell += o.upsell_amount; }
      }
      return [...m.values()];
    },
    stats_manager_daily({ p_from, p_to, p_fin, p_store }) {
      const list = scoped(p_store).filter((o) => cat(o) === 'success' && inR(fin(o, p_fin), p_from, p_to));
      return group(list, (o) => fin(o, p_fin) + '|' + o.manager_id, (k) => ({ day: k.split('|')[0], manager_id: Number(k.split('|')[1]), sales: 0, upsell: 0 }), (x, o) => { x.sales++; x.upsell += o.upsell_amount; });
    },
    stats_overview_meta() {
      return { orders: orders.length, first_order: orders[0]?.order_date, last_order: orders[orders.length - 1]?.order_time,
        sites: stores.map((st) => ({ id: st.id, orders: orders.filter((o) => o.sajt === st.id).length })) };
    },
  };
  const tables = { statuses, stores, managers, expenses, rules, sync_log: syncLog };
  const clone = (x) => JSON.parse(JSON.stringify(x));
  return {
    mode: 'demo',
    async session() { return { email: 'demo@shop.ua' }; },
    async signIn() { return { email: 'demo@shop.ua' }; },
    async signOut() {},
    async settings() { return clone(settings); },
    async setSetting(k, v) { settings[k] = v; },
    async rpc(name, params) { return clone(R[name](params)); },
    async list(table, opts = {}) {
      let rows = tables[table];
      if (table === 'expenses' && opts.from) rows = rows.filter((e) => e.date <= opts.to && (e.date_to || e.date) >= opts.from);
      if (table === 'expenses') rows = [...rows].sort((a, b) => b.date.localeCompare(a.date) || b.id - a.id);
      if (table === 'statuses' || table === 'stores') rows = [...rows].sort((a, b) => a.sort - b.sort);
      return clone(rows);
    },
    async insert(table, row) {
      const t = tables[table];
      const r = { ...row, id: table === 'rules' ? rid++ : eid++ };
      if (table === 'expenses') r.amount_uah = Math.round(r.amount * (r.rate || 1) * 100) / 100;
      t.push(r); return r;
    },
    async update(table, idv, patch) {
      const r = tables[table].find((x) => x.id === idv);
      Object.assign(r, patch);
      if (table === 'expenses') r.amount_uah = Math.round(r.amount * (r.rate || 1) * 100) / 100;
      return r;
    },
    async remove(table, idv) { const t = tables[table]; t.splice(t.findIndex((x) => x.id === idv), 1); },
    async sync() {
      await new Promise((r) => setTimeout(r, 900));
      const e = { id: syncLog.length + 1, at: new Date().toISOString(), mode: 'manual', orders: 0, pages: 1, ok: true, message: 'Демо: нових замовлень немає' };
      syncLog.unshift(e); settings.last_sync = e.at; settings.last_run = e.at;
      return { success: true, message: e.message };
    },
  };
}

</script>
<script>
// =====================================================================

    async session() { const { data } = await sb.auth.getSession(); return data.session ? { email: data.session.user.email } : null; },

    async signOut() { await sb.auth.signOut(); },
    async settings() { const rows = chk(await sb.from('settings').select('key,value')); return Object.fromEntries(rows.map((r) => [r.key, r.value])); },
    async setSetting(key, value) { chk(await sb.from('settings').upsert({ key, value })); },
    async rpc(name, params) { return chk(await sb.rpc(name, params)); },
    async list(table, opts = {}) {
      let q = sb.from(table).select('*');
      if (table === 'expenses' && opts.from) q = q.lte('date', opts.to).gte('date', addDays(opts.from, -400));
      const [col, asc] = ORDER[table] || ['id', true];
      q = q.order(col, { ascending: asc });
      if (table === 'expenses') q = q.order('id', { ascending: false });
      if (table === 'sync_log') q = q.limit(15);
      let rows = chk(await q);
      if (table === 'expenses' && opts.from) rows = rows.filter((e) => (e.date_to || e.date) >= opts.from);
      return rows;
    },
    async insert(table, row) { return chk(await sb.from(table).insert(row).select().single()); },
    async update(table, id, patch) { return chk(await sb.from(table).update(patch).eq('id', id).select().single()); },
    async remove(table, id) { chk(await sb.from(table).delete().eq('id', id)); },
    // Зміни від інших користувачів у реальному часі
    subscribe(cb) {

      return data;

  };

function emptyDay() { return { leads: 0, confirmed: 0, unconfirmed: 0, success: 0, fail: 0, returns: 0, work: 0, sales: 0, revenue: 0, cogs: 0, order_costs: 0, return_costs: 0, payed: 0, upsell: 0, ads: 0, other: 0, byCat: {}, adsByCh: {}, byRule: {} }; }

// Будує денний P&L: дані замовлень + ручні витрати + правила + з/п менеджерів
function buildDays(from, to, daily, expenses, rules, mgrDaily, managers, settings, storeDays = {}) {
  const days = {};
  for (let d = from; d <= to; d = addDays(d, 1)) days[d] = emptyDay();
  for (const r of daily) {
    const x = days[String(r.day).slice(0, 10)]; if (!x) continue;
    for (const k of ['leads', 'confirmed', 'unconfirmed', 'success', 'fail', 'returns', 'work', 'sales', 'revenue', 'cogs', 'order_costs', 'return_costs', 'payed', 'upsell']) x[k] += N(r[k]);
  }
  const add = (x, cat, v) => { x.byCat[cat] = (x.byCat[cat] || 0) + v; };
  for (const e of expenses) {
    const end = e.date_to && e.date_to >= e.date ? e.date_to : e.date;
    const per = N(e.amount_uah) / (daysBetween(e.date, end) + 1);
    for (let d = e.date > from ? e.date : from; d <= end && d <= to; d = addDays(d, 1)) {
      const x = days[d];
      if (e.category === 'Реклама') { x.ads += per; const ch = e.channel || 'Інше'; x.adsByCh[ch] = (x.adsByCh[ch] || 0) + per; } else x.other += per;
      add(x, e.category, per);
    }
  }
  for (const [d, x] of Object.entries(days)) {
    for (const r of rules) {
      if (!r.active || (r.date_from && d < r.date_from) || (r.date_to && d > r.date_to)) continue;
      // правило конкретного магазину в режимі «Усі» рахуємо від виручки саме цього магазину
      const base = r.store_id != null && storeDays[r.store_id] ? (storeDays[r.store_id][d] || { revenue: 0, sales: 0 }) : x;
      const v = r.kind === 'percent_revenue' ? base.revenue * N(r.value) / 100 : r.kind === 'fixed_monthly' ? N(r.value) / dim(d) : N(r.value) * base.sales;
      if (v) { x.other += v; add(x, r.category, v); x.byRule[r.id] = (x.byRule[r.id] || 0) + v; }
    }
  }
  if (settings.managers_in_pnl !== false) {
    const mm = new Map(managers.map((m) => [m.id, m]));
    for (const r of mgrDaily) {
      const x = days[String(r.day).slice(0, 10)]; const m = mm.get(N(r.manager_id)); if (!x || !m) continue;
      const v = N(m.rate_per_order) * N(r.sales) + N(m.upsell_pct) * N(r.upsell);
      if (v) { x.other += v; add(x, 'Зарплата менеджерів', v); }
    }
  }
  return days;
}
function totals(list) {
  const t = emptyDay();
  for (const x of list) {
    for (const k of Object.keys(t)) if (typeof t[k] === 'number') t[k] += x[k];
    for (const [c, v] of Object.entries(x.byCat)) t.byCat[c] = (t.byCat[c] || 0) + v;
    for (const [c, v] of Object.entries(x.adsByCh)) t.adsByCh[c] = (t.adsByCh[c] || 0) + v;
    for (const [c, v] of Object.entries(x.byRule)) t.byRule[c] = (t.byRule[c] || 0) + v;
  }
  const gross = t.revenue - t.cogs - t.order_costs - t.return_costs;
  const net = gross - t.ads - t.other;
  const closed = t.success + t.fail + t.returns;
  return Object.assign(t, {
    gross, net, closed,
    margin: div(t.revenue - t.cogs, t.revenue), grossMargin: div(gross, t.revenue), netMargin: div(net, t.revenue),
    confRate: div(t.confirmed, t.leads), cpc: t.ads ? div(t.ads, t.confirmed) : null,
    avg: div(t.revenue, t.sales), conv: div(t.success, t.leads), convClosed: div(t.success, closed),
    returnRate: div(t.returns, t.success + t.returns), refuseRate: div(t.fail + t.returns, closed),
    romi: div(gross - t.ads, t.ads), cpl: div(t.ads, t.leads), cpo: t.ads ? div(t.ads, t.sales) : null, drr: div(t.ads, t.revenue),
  });
}
function bucketKey(d, g) { if (g === 'month') return d.slice(0, 7); if (g === 'week') { const w = (P(d).getUTCDay() + 6) % 7; return addDays(d, -w); } return d; }
function bucketLabel(k, g) { if (g === 'month') return MON[+k.slice(5, 7) - 1] + ' ' + k.slice(2, 4); return k.slice(8, 10) + '.' + k.slice(5, 7); }
function series(days, g) {
  const m = new Map();
  for (const [d, x] of Object.entries(days)) { const k = bucketKey(d, g); if (!m.has(k)) m.set(k, []); m.get(k).push(x); }
  return [...m.entries()].map(([k, list]) => ({ key: k, label: bucketLabel(k, g), ...totals(list) }));
}

function rangeFor(p) {
  const t = new Date(); const to = ymd(t);
  const back = (n) => addDays(to, -n);
  switch (p) {
    case 'today': return [to, to];

function dayMap(rows) { const m = {}; for (const r of rows) m[String(r.day).slice(0, 10)] = { revenue: N(r.revenue), sales: N(r.sales) }; return m; }

function sparkSvg(vals) {

  else { if (!prev) return ''; d = (cur - prev) / Math.abs(prev); label = (d >= 0 ? '+' : '−') + Math.abs(d * 100).toFixed(0) + '%'; }

}

    <td class="n">${nf2.format(N(e.amount))} ${e.currency === 'UAH' ? '₴' : esc(e.currency)}</td><td class="n">${uah(N(e.amount_uah))}</td>${compact ? '' : `<td class="muted small">${esc(e.comment || '')}</td>`}${showWho ? `<td class="muted small" title="${esc(e.created_by || '')}">${esc((e.created_by || '').split('@')[0])}</td>` : ''}
    <td class="n" style="white-space:nowrap">${compact ? '' : `<button class="icon-btn" data-eedit="${e.id}" title="Редагувати">${icon('edit')}</button>`}<button class="icon-btn" data-edel="${e.id}" title="Видалити">${icon('trash')}</button></td></tr>`).join('')}</tbody></table>`;
}
function bindExpTable(list) {
  $$('[data-edel]').forEach((b) => b.addEventListener('click', async () => {
    if (!(await confirmBox('Видалити витрату?', 'Запис зникне зі звітів.'))) return;
    await api.remove('expenses', N(b.dataset.edel)); S.data = null; toast('Видалено'); render();
  }));
  $$('[data-eedit]').forEach((b) => b.addEventListener('click', () => {

    for (const k of ['date', 'date_to', 'category', 'channel', 'amount', 'currency', 'comment', 'store_id']) if (f[k]) f[k].value = e[k] ?? '';
    f.dataset.id = e.id; $('#expSubmit').textContent = 'Зберегти зміни'; $('#expCancel').hidden = false; toggleChan(); f.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }));
}
function rateFor(cur) { return cur === 'USD' ? N(S.settings.usd_rate) || 41.5 : cur === 'EUR' ? N(S.settings.eur_rate) || 45 : 1; }
async function saveExpense(f, id) {
  const amount = parseFloat(String(f.amount || '').replace(/\s/g, '').replace(',', '.'));
  if (!f.date || !Number.isFinite(amount) || !f.category) { toast('Заповніть дату, категорію і суму', true); return false; }
  const row = { date: f.date, date_to: f.date_to && f.date_to > f.date ? f.date_to : null, category: f.category, channel: f.category === 'Реклама' ? (f.channel || 'Інше') : null,
    amount, currency: f.currency || 'UAH', rate: rateFor(f.currency || 'UAH'), comment: f.comment || null,
    store_id: f.store_id === undefined ? (S.store ?? null) : (f.store_id === '' ? null : N(f.store_id)) };
  try { if (id) await api.update('expenses', N(id), row); else await api.insert('expenses', row); toast(id ? 'Зміни збережено' : 'Витрату додано'); return true; }
  catch (e) { toast(e.message, true); return false; }

function ruleTotal(r, D) {
  if (!r.active) return 0;
  let v = 0;
  for (const [d, x] of Object.entries(D.days)) {
    if ((r.date_from && d < r.date_from) || (r.date_to && d > r.date_to)) continue;
    v += r.kind === 'percent_revenue' ? x.revenue * N(r.value) / 100 : r.kind === 'fixed_monthly' ? N(r.value) / dim(d) : N(r.value) * x.sales;
  }
  return v;
}

    try {
      for (const tr of $$('[data-shop]')) await api.update('stores', N(tr.dataset.shop), { name: $('[data-f="name"]', tr).value.trim() || null, active: $('[data-f="active"]', tr).checked });
      S.stores = await api.list('stores'); S.data = null; toast('Магазини збережено');
    } catch (e) { toast(e.message, true); }
  });
  $('#mgSave')?.addEventListener('click', async () => {
    try {
      for (const tr of $$('[data-mg]')) {
        const v = (f) => $(`[data-f="${f}"]`, tr).value.trim(); const n = (f) => parseFloat(v(f).replace(',', '.')) || 0;
        await api.update('managers', N(tr.dataset.mg), { name: v('name') || null, rate_per_order: n('rate_per_order'), upsell_pct: n('upsell_pct') / 100 });
      }
      S.managers = await api.list('managers'); S.data = null; toast('Менеджерів збережено');
    } catch (e) { toast(e.message, true); }
  });
};

// ---------------------------------------------------------------- синхронізація
async function runSync(body) {
  const btn = $('#syncBtn'); btn.disabled = true; $('#syncPill .dot').classList.add('spin'); $('#syncPill span').textContent = 'Оновлюю…';
  try {
    const r = await api.sync(body);
    toast(r.success === false ? 'Помилка: ' + r.error : (r.message || 'Готово'), r.success === false);
    await loadRefs(); S.data = null; render();
  } catch (e) { toast('Помилка синхронізації: ' + e.message, true); }
  finally { btn.disabled = false; $('#syncPill .dot')?.classList.remove('spin'); updateSyncPill(); }
}

// ---------------------------------------------------------------- реальний час
let liveTimer = null, livePending = false;
function onRemoteChange(table) {
  clearTimeout(liveTimer);
  liveTimer = setTimeout(async () => {
    try { await loadRefs(); } catch { return; }
    S.data = null; updateSyncPill();
    const el = document.activeElement;
    const typing = el && el.closest && el.closest('#page form, #page [data-mg], #page [data-shop]') && ['INPUT', 'SELECT', 'TEXTAREA'].includes(el.tagName);
    if (typing) { livePending = true; showLiveBar(); return; }
    render(); toast(table === 'sync_log' ? 'Підтягнулися нові замовлення' : 'Дані оновлено: зміни від іншого користувача');
  }, 900);
}
function showLiveBar() {
  if ($('#liveBar')) return;
  const b = document.createElement('div'); b.id = 'liveBar'; b.className = 'hint'; b.style.cssText = 'margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:10px';
  b.innerHTML = '<span>Хтось інший змінив дані. Оновіть сторінку, коли закінчите вводити.</span><button class="btn sm primary">Оновити</button>';
  b.querySelector('button').addEventListener('click', () => { livePending = false; b.remove(); render(); });
  $('#page').before(b);
}

// ---------------------------------------------------------------- підказки
document.addEventListener('pointermove', (e) => {
  const tip = $('#tip'); const el = e.target.closest?.('[data-tip]');
  if (!el || !el.dataset.tip) { tip.style.display = 'none'; return; }
  tip.textContent = el.dataset.tip; tip.style.display = 'block';
  tip.style.left = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8) + 'px'; tip.style.top = (e.clientY + 16) + 'px';
});
window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => render());
new MutationObserver(() => render()).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });

// ---------------------------------------------------------------- вхід і старт
function loginView(err = '') {
  $('#app').innerHTML = `<div class="login"><form id="loginF" autocomplete="on">${LOGO}<h1>Аналітика магазину</h1><div class="muted small">Увійдіть обліковим записом, створеним у Supabase</div>
    <label class="f">Email<input type="email" name="email" id="lEmail" required autocomplete="username"></label>
    <label class="f">Пароль<input type="password" name="password" id="lPass" required autocomplete="current-password"></label>
    <div class="err" id="lErr">${esc(err)}</div><button class="btn primary" style="justify-content:center">Увійти</button></form></div>`;
  $('#loginF').addEventListener('submit', async (e) => {
    e.preventDefault(); const f = e.target;
    try { S.user = await api.signIn(f.email.value.trim(), f.password.value); boot(); } catch (err2) { $('#lErr').textContent = err2.message; }
  });
}
async function boot() {
  if (CONFIG.SUPABASE_URL && !window.supabase) { $('#app').innerHTML = '<div class="login"><form><h1>Немає з’єднання</h1><div class="muted">Не вдалося завантажити бібліотеку Supabase. Перевірте інтернет і оновіть сторінку.</div></form></div>'; return; }
  S.user = S.user || (await api.session());
  if (!S.user) return loginView();
  try { await loadRefs(); } catch (e) { return loginView('Немає доступу до бази: ' + e.message); }
  const h = location.hash.slice(1); if (TITLES[h]) S.page = h;
  shell(); render();
  if (api.subscribe) api.subscribe(onRemoteChange);
  setInterval(async () => { try { S.settings = await api.settings(); updateSyncPill(); } catch { /* ok */ } }, 5 * 60e3);
}
boot();
})();

</script>
</body>
</html>
